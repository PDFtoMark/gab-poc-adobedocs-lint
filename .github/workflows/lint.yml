---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fabricate linter report
        run: |
          echo "poisoned report produced by the untrusted pull_request run" > linter-report.txt
          echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload poisoned artifact
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            evil.js
